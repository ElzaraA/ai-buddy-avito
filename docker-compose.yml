services:
  api:
    build: .
    # Только 127.0.0.1: в общей сети (демо-ноутбук, конференц-Wi-Fi) API снаружи недоступен
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - LLM_MOCK=${LLM_MOCK:-true}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_FALLBACK=${LLM_FALLBACK:-true}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Состояние переживает перезапуск контейнера; сброс: docker compose down -v
      - STATE_FILE=/app/state/state.json
    volumes:
      - ./data:/app/data:ro
      - buddy-state:/app/state
    restart: unless-stopped

  # UI: http://localhost:5173 (nginx отдаёт статику и проксирует /api на бэкенд)
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  buddy-state:
