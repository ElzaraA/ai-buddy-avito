openapi: 3.0.3
info:
  title: AI-buddy API (frontend <-> backend)
  version: 0.3.0
  description: |
    Контракт, который реально реализует Go-бэкенд (internal/api) и проверяется тестами
    internal/api/chat_test.go и internal/api/actions_api_test.go. Фронт валидирует ответы Zod-схемами
    (frontend/src/api/schemas.ts) по этому же контракту.

    Авторизация в прототипе имитирует SSO Авито: пользователь задаётся заголовком `X-Demo-User`
    (`?user=` действует только для SSE `/chat/sessions/{sessionId}/events`: EventSource не умеет слать заголовки).
    Без заголовка — `intern.backend`, неизвестный логин — 401. Изменяющий запрос (POST, PATCH, PUT, DELETE) с `Origin` не из `CORS_ORIGINS` отклоняется (403 forbidden);
    запросы без `Origin` (curl, MCP-клиенты) и GET не затрагиваются.
    Тестовые логины: intern.backend, intern.junior, intern.other, mentor.backend, lead.backend, lead.frontend.

    Ошибки всегда в формате `{"error":{"code","message"}}` — в том числе неизвестный маршрут (404 not_found),
    неподдерживаемый метод (405 method_not_allowed) и тело больше 64 KiB (413 payload_too_large).
    Все изменяющие маршруты ограничены по частоте на пользователя (RATE_LIMIT_PER_MIN) — 429 rate_limited с Retry-After.
servers:
  - url: http://localhost:8080/api/v1

security:
  - demoUser: []

paths:
  /me:
    get:
      summary: Текущий пользователь
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /onboarding/progress:
    get:
      summary: Чек-лист стажёра, следующий шаг и процент выполнения
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Progress' } } } }

  /onboarding/steps/{stepId}:
    patch:
      summary: Отметить свой шаг выполненным (чужой шаг — 403)
      parameters:
        - { name: stepId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [done] }
      responses:
        '200': { description: Обновлённый прогресс, content: { application/json: { schema: { $ref: '#/components/schemas/Progress' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /chat/sessions:
    get:
      summary: История своих диалогов с Бадди (с хотя бы одним сообщением), новые первыми
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } } } }
    post:
      summary: Создать диалог
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ChatSession' } } } }

  /chat/sessions/{sessionId}/messages:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      summary: История диалога (только своего; чужой — 403)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: |
        Отправить сообщение. Ответ 202 приходит сразу (<10 мс), ответ агента — событием message_done в SSE.
        Принимается поле `text` (openapi) или `question` (совместимость).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 2000 }
                question: { type: string, maxLength: 2000 }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [user_message_id, assistant_message_id, messageId, status]
                properties:
                  user_message_id: { type: string }
                  assistant_message_id: { type: string }
                  messageId: { type: string, description: то же, что assistant_message_id }
                  status: { type: string, enum: [pending] }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { description: 'rate_limited (лимит в минуту или 3 ответа уже в работе) или session_full (200 сообщений)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /chat/sessions/{sessionId}/events:
    get:
      summary: |
        SSE-поток диалога. События: status → tool_result (если был вызван инструмент) → message_done; error при сбое.
        При подключении повторно отдаются уже готовые ответы (клиент дедуплицирует по message_id).
        Каждые 15 с — комментарий `: ping`.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { name: user, in: query, required: false, schema: { type: string }, description: 'логин вместо X-Demo-User; действует только на этом маршруте, на остальных игнорируется' }
      responses:
        '200':
          description: text/event-stream; поле data — JSON ChatEvent
          content: { text/event-stream: { schema: { $ref: '#/components/schemas/ChatEvent' } } }
        '403': { $ref: '#/components/responses/Error' }

  /actions:
    get:
      summary: Мои действия (черновики и подтверждённые), новые сверху
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Action' } } } } }
    post:
      summary: Создать черновик действия вручную (из UI)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [absence, access] }
                date_from: { type: string, format: date, description: 'обязательно для absence; не в прошлом и не дальше 5 лет вперёд' }
                date_to: { type: string, format: date, description: 'обязательно для absence, >= date_from' }
                resource: { type: string, description: обязательно для access }
                reason: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { description: 'rate_limited или too_many_drafts (больше 50 неподтверждённых черновиков)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /actions/{actionId}:
    get:
      summary: Моё действие (чужое — 403)
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /actions/{actionId}/confirm:
    post:
      summary: |
        Подтвердить черновик (draft → pending). Атомарно: при параллельных запросах успешен ровно один,
        остальные — 409 (также 409 для отменённого черновика). Проверяются владелец (403) и право роли
        (absence.create / access.request); устаревший черновик (дата уже прошла) — 400.
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /actions/{actionId}/cancel:
    post:
      summary: Владелец отменяет черновик или отправленную заявку (draft | pending → cancelled)
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /actions/{actionId}/approve:
    post:
      summary: |
        Руководитель согласует заявку своей команды (pending → approved). Нельзя согласовать свою заявку,
        чужой команды или не отправленную. Для заявки на доступ шаг чек-листа стажёра становится done.
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /actions/{actionId}/reject:
    post:
      summary: Руководитель отклоняет заявку своей команды (pending → rejected); шаг чек-листа возвращается в todo
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /team/progress:
    get:
      summary: Прогресс стажёров своей команды (наставник, руководитель; стажёру — 403)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - { $ref: '#/components/schemas/Progress' }
                    - { type: object, properties: { user: { $ref: '#/components/schemas/User' } } }
        '403': { $ref: '#/components/responses/Error' }

  /team/actions:
    get:
      summary: Заявки своей команды, кроме черновиков; ?status=pending — входящие на согласование
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, rejected, cancelled] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Action' } } } } }
        '400': { description: неизвестный status, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'стажёру; или status=draft (черновики приватны)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /team/signals:
    get:
      summary: Сообщения стажёров своей команды наставнику «что-то не так» (именные; открытые сверху, затем разобранные; стажёру — 403)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Signal' }
        '403': { $ref: '#/components/responses/Error' }

  /team/signals/{signalId}/resolve:
    post:
      summary: Наставник или руководитель отмечает сообщение своей команды разобранным и (необязательно) отвечает стажёру (сигнал чужой команды — 404)
      description: |
        Тело необязательно (пустое тело — просто «разобрано»). reply ≤ 500 символов, персональные данные маскируются;
        пустой reply не затирает ранее сохранённый ответ. Заполняются resolved_by (имя наставника) и resolved_at.
        Стажёр видит ответ в GET /signals/me.
      parameters:
        - { name: signalId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reply: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  signal: { $ref: '#/components/schemas/Signal' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /signals/me:
    get:
      summary: Свои сообщения наставнику (стажёр), новые сверху, с ответом наставника (не стажёру — 403)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Signal' } } } } }
        '403': { $ref: '#/components/responses/Error' }

  /demo:
    get:
      summary: Демо-режим и тип модели
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [demo_mode, llm]
                properties:
                  demo_mode: { type: boolean, description: 'DEMO_MODE=true — доступен POST /demo/reset' }
                  llm: { type: string, enum: [mock, real], description: 'mock при LLM_MOCK=true или без LLM_API_KEY' }

  /demo/reset:
    post:
      summary: Сбросить всё состояние в памяти к исходному сиду (как свежий старт); только при DEMO_MODE=true
      description: |
        Сбрасываются заявки, чек-листы (заново засеваются демо-чек-листы), сигналы и ответы, «Пульс», пробелы базы знаний,
        «Сэкономлено наставнику», счётчики достижений, диалоги и сообщения чата. Доступно любому демо-пользователю,
        ограничено по частоте. Без DEMO_MODE=true — 404 not_found.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean, enum: [true] } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /team/knowledge-gaps:
    get:
      summary: Вопросы стажёров команды, на которые в базе знаний нет ответа (без автора, персональные данные маскируются; частые сверху)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    question: { type: string }
                    count: { type: integer }
                    last_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }

  /schedule:
    get:
      summary: Расписание пользователя — встречи команды (стендап, 1:1, планирование, ретро) и личные созвоны
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 31, default: 7 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  reminder_lead_min: { type: integer, description: за сколько минут до встречи приходит напоминание в чат }
                  items: { type: array, items: { $ref: '#/components/schemas/Occurrence' } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: Добавить личный созвон в своё расписание
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, start]
              properties:
                title: { type: string, maxLength: 120 }
                start: { type: string, description: 'RFC3339 или «2026-11-16T15:00» по Москве; только будущее, не дальше 60 дней' }
                duration_min: { type: integer, minimum: 5, maximum: 240, default: 30 }
                with: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Созвон добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Occurrence' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /schedule/{id}/cancel:
    post:
      summary: Отменить свой созвон (встречи команды не отменяются; чужой созвон — 404)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Отменён }
        '404': { $ref: '#/components/responses/Error' }

  /reminders:
    get:
      summary: Встречи, которые начнутся в ближайшие reminder_lead_min минут и о которых ещё не напоминали
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Occurrence'
                    - type: object
                      properties:
                        text: { type: string, example: 'Через 15 минут — Стендап команды в 11:00, Яндекс Телемост.' }

  /reminders/{id}/ack:
    post:
      summary: Напоминание показано в чате — больше его не присылать
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
        '400': { $ref: '#/components/responses/Error' }

  /tasks:
    get:
      summary: Задачи адаптации своей команды; у стажёра — с его статусами
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [todo, in_progress, done, skipped] } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaskView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, example: be-02 } }
    get:
      summary: Задача своей команды (чужая — 404)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /tasks/{id}/{op}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: op, in: path, required: true, schema: { type: string, enum: [start, complete, skip, reopen] } }
    post:
      summary: |
        Сменить статус задачи (только стажёр, только своей команды). start — взять в работу (не больше 3 одновременно),
        complete — сделано (из «в работе»), skip — отложить, reopen — вернуть отложенную.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /recommendations:
    get:
      summary: |
        Рекомендованные следующие задачи стажёра. Модель — логистическая регрессия (ml/recsys), веса data/recsys/model.json;
        без весов — прозрачное правило, source=rule_based. Только для стажёра (403 для наставника и руководителя).
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 3 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Recommendations' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /knowledge:
    get:
      summary: |
        Статьи базы знаний, в которых пользователю виден хотя бы один раздел (роль и команда — как у поиска Бадди).
        С параметром q — поиск по разделам: { query, hits[] }.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 300 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: array, items: { $ref: '#/components/schemas/KnowledgeDoc' } }
                  query: { type: string }
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        doc_id: { type: string }
                        title: { type: string }
                        section: { type: string }
                        snippet: { type: string }
                        score: { type: number }
        '400': { $ref: '#/components/responses/Error' }

  /knowledge/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, example: tools.md } }
    get:
      summary: Статья с видимыми пользователю разделами (закрытая или чужой команды — 404)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeDoc' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /team/interns/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, example: intern-1 } }
    get:
      summary: |
        Карточка стажёра своей команды для наставника и руководителя: прогресс, «Пульс», заявки (без черновиков),
        обращения и задачи с рекомендациями. Стажёр другой команды — 404, роль стажёра — 403.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /team/summary:
    get:
      summary: Сводка метрик пользы по команде
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  interns: { type: integer }
                  avg_percent_done: { type: integer }
                  steps_waiting: { type: integer }
                  actions: { type: object, additionalProperties: { type: integer }, description: число заявок по статусам }
                  unanswered_topics: { type: integer }
                  unanswered_requests: { type: integer }
                  questions_closed: { type: integer, description: 'честный учёт: kb_answers + glossary_answers + confirmed_actions' }
                  kb_answers: { type: integer, description: ответы по базе знаний с источником }
                  glossary_answers: { type: integer, description: объяснения терминов из словаря Бадди }
                  confirmed_actions: { type: integer, description: 'заявки, подтверждённые стажёром (считаются при confirm; отмена списывает; черновики, меню, small talk и чек-лист не считаются)' }
                  signals_total: { type: integer, description: сообщения стажёров, переданные наставнику }
                  refusals_total: { type: integer, description: отказы Бадди (нет в базе, нет прав) }
                  mentor_minutes_saved: { type: integer, description: 'оценка: questions_closed × minutes_per_question' }
                  minutes_per_question: { type: integer, description: 'допущение оценки: 5 минут наставника на типовой вопрос' }
                  closed_share: { type: number, description: 'closed / (closed + signals + refusals), 0..1' }
        '403': { $ref: '#/components/responses/Error' }

  /team/pulse:
    get:
      summary: «Пульс команды» — самочувствие стажёров своей команды за 7 дней; сначала те, кому нужно внимание (стажёру — 403)
      description: |
        risk = сегодня ≤ 2, или две из трёх последних отметок за 7 дней ≤ 2, или среднее за 7 дней ≤ 2.5.
        trend — последняя отметка окна против среднего предыдущих (±0.5). Заметку видят только наставник и руководитель команды.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user: { $ref: '#/components/schemas/User' }
                    today: { type: integer, nullable: true, minimum: 1, maximum: 5 }
                    avg7: { type: number, nullable: true }
                    trend: { type: string, enum: [up, down, flat] }
                    risk: { type: boolean }
                    risk_reason: { type: string, description: причина по-русски, например «сегодня отметил(а) «Тяжело»» }
                    days: { type: array, items: { type: object, properties: { date: { type: string, format: date }, mood: { type: integer, nullable: true } } } }
                    note: { type: string, description: последняя заметка за 7 дней (персональные данные маскируются) }
                    note_date: { type: string, format: date }
        '403': { $ref: '#/components/responses/Error' }

  /pulse:
    post:
      summary: «Пульс» — отметка самочувствия стажёра за сегодня (повторная отметка перезаписывает сегодняшнюю; не стажёру — 403)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mood]
              properties:
                mood: { type: integer, minimum: 1, maximum: 5, description: '1 Тяжело, 2 Так себе, 3 Нормально, 4 Хорошо, 5 Отлично' }
                note: { type: string, maxLength: 300 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PulseEntry' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /pulse/me:
    get:
      summary: Последние 14 отметок «Пульса» стажёра (старые первыми) и сегодняшняя дата сервера
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: { type: string, format: date }
                  entries: { type: array, items: { $ref: '#/components/schemas/PulseEntry' } }
        '403': { $ref: '#/components/responses/Error' }

  /achievements:
    get:
      summary: Достижения стажёра (выводятся из состояния; порядок — от простых к сложным; не стажёру — 403)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, enum: [first_question, first_action, brave_ask, pulse_streak, access_done, half_way, week1_done] }
                    title: { type: string }
                    description: { type: string }
                    unlocked: { type: boolean }
                    unlocked_at: { type: string, format: date-time }
                    hint: { type: string }
        '403': { $ref: '#/components/responses/Error' }

  /ask:
    post:
      summary: Синхронный вариант чата (для проверки curl'ом). Также доступен как POST /api/ask.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { text: { type: string }, question: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AgentResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

# Вне /api/v1 (см. README): GET /health, GET /metrics (Prometheus), POST /mcp (MCP, JSON-RPC 2.0), POST /api/ask.

components:
  securitySchemes:
    demoUser: { type: apiKey, in: header, name: X-Demo-User }

  responses:
    Error:
      description: Ошибка
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    TaskView:
      type: object
      properties:
        id: { type: string, example: be-02 }
        team: { type: string }
        title: { type: string }
        summary: { type: string }
        steps: { type: array, items: { type: string } }
        definition_of_done: { type: string }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string } }
        popularity: { type: integer }
        estimate_hours: { type: integer }
        knowledge: { type: string, example: code-review.md }
        status: { type: string, enum: [todo, in_progress, done, skipped] }
        started_at: { type: string, format: date-time }
        done_at: { type: string, format: date-time }
    Recommendations:
      type: object
      properties:
        source: { type: string, enum: [model, rule_based] }
        model: { type: string, example: logreg-v1 }
        items:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/TaskView' }
              - type: object
                properties:
                  score: { type: number, example: 0.71 }
                  reasons: { type: array, items: { type: string } }
    KnowledgeDoc:
      type: object
      properties:
        id: { type: string, example: tools.md }
        title: { type: string }
        stages: { type: array, items: { type: string } }
        disclaimer: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              stage: { type: string }
              text: { type: string }
    SessionSummary:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        last_at: { type: string, format: date-time }
        first_question: { type: string }
        messages: { type: integer }
    Occurrence:
      type: object
      properties:
        id: { type: string, example: 'standup@2026-11-16T11:00' }
        title: { type: string }
        kind: { type: string, enum: [standup, one_on_one, planning, retro, personal] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        place: { type: string }
        with: { type: string }
        recurring: { type: boolean, description: встреча команды; из интерфейса не отменяется }
        meeting_id: { type: string, description: для личного созвона — id для отмены }
    PulseEntry:
      type: object
      properties:
        date: { type: string, format: date }
        mood: { type: integer, minimum: 1, maximum: 5 }
        note: { type: string }
        at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, unauthorized, forbidden, not_found, method_not_allowed, conflict, payload_too_large, rate_limited, too_many_drafts, session_full, agent_error, sse_unsupported] }
            message: { type: string }

    Decision:
      type: object
      properties:
        comment: { type: string, maxLength: 500 }

    User:
      type: object
      required: [id, name, role, team_id]
      properties:
        id: { type: string, example: intern-1 }
        name: { type: string }
        role: { type: string, enum: [intern, buddy, lead, hr_bp] }
        team_id: { type: string, example: backend }

    ChecklistItem:
      type: object
      required: [id, title, stage, done]
      properties:
        id: { type: string, example: c2-intern-1 }
        title: { type: string }
        stage: { type: string, example: week1 }
        done: { type: boolean }
        status: { type: string, enum: [todo, waiting, done], description: waiting — шаг ждёт решения по заявке }
        kind: { type: string, description: access — шаг связан с заявками на доступ }
        related_action_id: { type: string, description: заявка, которой ждёт шаг }
        owner: { type: string }
        sub_done: { type: integer, description: 'только kind=access: сколько систем (GitLab/Git, Jira, Grafana) уже одобрено' }
        sub_total: { type: integer, description: 'только kind=access: всего систем в шаге (3)' }
        missing: { type: array, items: { type: string, enum: [gitlab, jira, grafana] }, description: 'только kind=access: системы без заявки (ещё не запрошены)' }

    Signal:
      type: object
      required: [id, user_id, text, topic, at, done]
      properties:
        id: { type: string, example: SIG-000001 }
        user_id: { type: string }
        text: { type: string, description: 'до 500 символов, персональные данные маскируются' }
        topic: { type: string, enum: [blocked, tech, unclear, other] }
        at: { type: string, format: date-time }
        done: { type: boolean }
        reply: { type: string, maxLength: 500, description: 'ответ наставника (PII маскируются); нет — поле отсутствует' }
        resolved_by: { type: string, description: имя наставника или руководителя, разобравшего сообщение }
        resolved_at: { type: string, format: date-time }

    Progress:
      type: object
      required: [items, next_step, percent_done]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
        next_step: { type: string }
        percent_done: { type: integer, minimum: 0, maximum: 100 }

    ChatSession:
      type: object
      required: [id, user_id, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }

    ChatMessage:
      type: object
      required: [id, session_id, role, status, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        status: { type: string, enum: [pending, in_progress, done, failed] }
        result: { type: string, description: JSON AgentResponse (для ответов помощника) }
        created_at: { type: string, format: date-time }

    Source:
      type: object
      properties:
        id: { type: string, example: 'checklist.md#week1#1' }
        source: { type: string, example: checklist.md }
        stage: { type: string }
        title: { type: string, description: заголовок раздела базы знаний }

    ToolResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
        data: { type: object, additionalProperties: true }

    AgentResponse:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [answer, action, draft, refusal] }
        text: { type: string }
        action: { type: string, enum: [absence, access], description: для draft }
        args:
          type: object
          additionalProperties: { type: string }
          description: |
            Для draft absence: date_from, date_to, reason, suggest_notify_buddy (только у стажёров), action_id (если даты известны).
            Для draft access: resource (jira, gitlab, grafana, git), reason, action_id. На другую систему черновика нет — type=refusal.
        tool: { type: string, description: 'имя выполненного инструмента для type=action (например checklist_get)' }
        result: { $ref: '#/components/schemas/ToolResult' }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
        buddy_name: { type: string, description: наставник команды пользователя }
        manager_name: { type: string, description: руководитель команды пользователя }
        degraded: { type: boolean, description: ответ дан резервной моделью (основная LLM недоступна) }

    ChatEvent:
      type: object
      required: [type, message_id]
      properties:
        type: { type: string, enum: [status, tool_result, message_done, error] }
        message_id: { type: string }
        messageId: { type: string }
        status: { type: string, enum: [thinking, done, failed] }
        ok: { type: boolean }
        data: { $ref: '#/components/schemas/ToolResult' }
        result: { $ref: '#/components/schemas/AgentResponse' }
        error: { type: string }

    Action:
      type: object
      required: [id, type, user_id, status, created_at]
      properties:
        id: { type: string, example: ABS-000001 }
        type: { type: string, enum: [absence, access] }
        resource: { type: string, example: gitlab }
        user_id: { type: string }
        date_from: { type: string }
        date_to: { type: string }
        reason: { type: string }
        team_id: { type: string }
        status: { type: string, enum: [draft, pending, approved, rejected, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        history:
          type: array
          description: Кто и когда перевёл заявку в статус
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              by: { type: string, description: id пользователя }
              status: { type: string }
              comment: { type: string }
