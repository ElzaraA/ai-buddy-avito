openapi: 3.0.3
info:
  title: AI-buddy API (frontend <-> backend)
  version: 0.3.0
  description: |
    Контракт, который реально реализует Go-бэкенд (internal/api) и проверяется тестами
    internal/api/chat_test.go и internal/api/actions_api_test.go. Фронт валидирует ответы Zod-схемами
    (frontend/src/api/schemas.ts) по этому же контракту.

    Авторизация в прототипе имитирует SSO Авито: пользователь задаётся заголовком `X-Demo-User`
    (`?user=` действует только для SSE `/chat/sessions/{sessionId}/events`: EventSource не умеет слать заголовки).
    Без заголовка — `intern.backend`, неизвестный логин — 401. Изменяющий запрос (POST, PATCH, PUT, DELETE) с `Origin` не из `CORS_ORIGINS` отклоняется (403 forbidden);
    запросы без `Origin` (curl, MCP-клиенты) и GET не затрагиваются.
    Тестовые логины: intern.backend, intern.junior, intern.other, mentor.backend, lead.backend, lead.frontend.

    Ошибки всегда в формате `{"error":{"code","message"}}`.
servers:
  - url: http://localhost:8080/api/v1

security:
  - demoUser: []

paths:
  /me:
    get:
      summary: Текущий пользователь
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /onboarding/progress:
    get:
      summary: Чек-лист стажёра, следующий шаг и процент выполнения
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Progress' } } } }

  /onboarding/steps/{stepId}:
    patch:
      summary: Отметить свой шаг выполненным (чужой шаг — 403)
      parameters:
        - { name: stepId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [done] }
      responses:
        '200': { description: Обновлённый прогресс, content: { application/json: { schema: { $ref: '#/components/schemas/Progress' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /chat/sessions:
    post:
      summary: Создать диалог
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ChatSession' } } } }

  /chat/sessions/{sessionId}/messages:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      summary: История диалога (только своего; чужой — 403)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: |
        Отправить сообщение. Ответ 202 приходит сразу (<10 мс), ответ агента — событием message_done в SSE.
        Принимается поле `text` (openapi) или `question` (совместимость).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 2000 }
                question: { type: string, maxLength: 2000 }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [user_message_id, assistant_message_id, messageId, status]
                properties:
                  user_message_id: { type: string }
                  assistant_message_id: { type: string }
                  messageId: { type: string, description: то же, что assistant_message_id }
                  status: { type: string, enum: [pending] }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /chat/sessions/{sessionId}/events:
    get:
      summary: |
        SSE-поток диалога. События: status → tool_result (если был вызван инструмент) → message_done; error при сбое.
        При подключении повторно отдаются уже готовые ответы (клиент дедуплицирует по message_id).
        Каждые 15 с — комментарий `: ping`.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { name: user, in: query, required: false, schema: { type: string }, description: 'логин вместо X-Demo-User; действует только на этом маршруте, на остальных игнорируется' }
      responses:
        '200':
          description: text/event-stream; поле data — JSON ChatEvent
          content: { text/event-stream: { schema: { $ref: '#/components/schemas/ChatEvent' } } }
        '403': { $ref: '#/components/responses/Error' }

  /actions:
    get:
      summary: Мои действия (черновики и подтверждённые), новые сверху
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Action' } } } } }
    post:
      summary: Создать черновик действия вручную (из UI)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [absence, access] }
                date_from: { type: string, format: date, description: обязательно для absence }
                date_to: { type: string, format: date, description: обязательно для absence, >= date_from }
                resource: { type: string, description: обязательно для access }
                reason: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /actions/{actionId}:
    get:
      summary: Моё действие (чужое — 403)
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /actions/{actionId}/confirm:
    post:
      summary: |
        Подтвердить черновик (draft → pending). Атомарно: при параллельных запросах успешен ровно один,
        остальные — 409. Проверяются владелец (403) и право роли (absence.create / access.request).
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /actions/{actionId}/cancel:
    post:
      summary: Владелец отменяет черновик или отправленную заявку (draft | pending → cancelled)
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /actions/{actionId}/approve:
    post:
      summary: |
        Руководитель согласует заявку своей команды (pending → approved). Нельзя согласовать свою заявку,
        чужой команды или не отправленную. Для заявки на доступ шаг чек-листа стажёра становится done.
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /actions/{actionId}/reject:
    post:
      summary: Руководитель отклоняет заявку своей команды (pending → rejected); шаг чек-листа возвращается в todo
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /team/progress:
    get:
      summary: Прогресс стажёров своей команды (наставник, руководитель; стажёру — 403)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - { $ref: '#/components/schemas/Progress' }
                    - { type: object, properties: { user: { $ref: '#/components/schemas/User' } } }
        '403': { $ref: '#/components/responses/Error' }

  /team/actions:
    get:
      summary: Заявки своей команды, кроме черновиков; ?status=pending — входящие на согласование
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, rejected, cancelled] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Action' } } } } }
        '403': { $ref: '#/components/responses/Error' }

  /team/knowledge-gaps:
    get:
      summary: Вопросы стажёров команды, на которые в базе знаний нет ответа (без автора, персональные данные маскируются; частые сверху)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    question: { type: string }
                    count: { type: integer }
                    last_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }

  /team/summary:
    get:
      summary: Сводка метрик пользы по команде
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  interns: { type: integer }
                  avg_percent_done: { type: integer }
                  steps_waiting: { type: integer }
                  actions: { type: object, additionalProperties: { type: integer }, description: число заявок по статусам }
                  unanswered_topics: { type: integer }
                  unanswered_requests: { type: integer }
        '403': { $ref: '#/components/responses/Error' }

  /ask:
    post:
      summary: Синхронный вариант чата (для проверки curl'ом). Также доступен как POST /api/ask.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { text: { type: string }, question: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AgentResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

# Вне /api/v1 (см. README): GET /health, GET /metrics (Prometheus), POST /mcp (MCP, JSON-RPC 2.0), POST /api/ask.

components:
  securitySchemes:
    demoUser: { type: apiKey, in: header, name: X-Demo-User }

  responses:
    Error:
      description: Ошибка
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, unauthorized, forbidden, not_found, conflict, rate_limited, agent_error, sse_unsupported] }
            message: { type: string }

    Decision:
      type: object
      properties:
        comment: { type: string, maxLength: 500 }

    User:
      type: object
      required: [id, name, role, team_id]
      properties:
        id: { type: string, example: intern-1 }
        name: { type: string }
        role: { type: string, enum: [intern, buddy, lead, hr_bp] }
        team_id: { type: string, example: backend }

    ChecklistItem:
      type: object
      required: [id, title, stage, done]
      properties:
        id: { type: string, example: c2-intern-1 }
        title: { type: string }
        stage: { type: string, example: week1 }
        done: { type: boolean }
        status: { type: string, enum: [todo, waiting, done], description: waiting — шаг ждёт решения по заявке }
        kind: { type: string, description: access — шаг связан с заявками на доступ }
        related_action_id: { type: string, description: заявка, которой ждёт шаг }
        owner: { type: string }

    Progress:
      type: object
      required: [items, next_step, percent_done]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
        next_step: { type: string }
        percent_done: { type: integer, minimum: 0, maximum: 100 }

    ChatSession:
      type: object
      required: [id, user_id, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }

    ChatMessage:
      type: object
      required: [id, session_id, role, status, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        status: { type: string, enum: [pending, in_progress, done, failed] }
        result: { type: string, description: JSON AgentResponse (для ответов помощника) }
        created_at: { type: string, format: date-time }

    Source:
      type: object
      properties:
        id: { type: string, example: 'checklist.md#week1#1' }
        source: { type: string, example: checklist.md }
        stage: { type: string }
        title: { type: string, description: заголовок раздела базы знаний }

    ToolResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
        data: { type: object, additionalProperties: true }

    AgentResponse:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [answer, action, draft, refusal] }
        text: { type: string }
        action: { type: string, enum: [absence, access], description: для draft }
        args:
          type: object
          additionalProperties: { type: string }
          description: |
            Для draft absence: date_from, date_to, reason, suggest_notify_buddy (только у стажёров), action_id (если даты известны).
            Для draft access: resource (jira, gitlab, grafana, git), reason, action_id. На другую систему черновика нет — type=refusal.
        tool: { type: string, description: 'имя выполненного инструмента для type=action (например checklist_get)' }
        result: { $ref: '#/components/schemas/ToolResult' }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
        buddy_name: { type: string, description: наставник команды пользователя }
        manager_name: { type: string, description: руководитель команды пользователя }
        degraded: { type: boolean, description: ответ дан резервной моделью (основная LLM недоступна) }

    ChatEvent:
      type: object
      required: [type, message_id]
      properties:
        type: { type: string, enum: [status, tool_result, message_done, error] }
        message_id: { type: string }
        messageId: { type: string }
        status: { type: string, enum: [thinking, done, failed] }
        ok: { type: boolean }
        data: { $ref: '#/components/schemas/ToolResult' }
        result: { $ref: '#/components/schemas/AgentResponse' }
        error: { type: string }

    Action:
      type: object
      required: [id, type, user_id, status, created_at]
      properties:
        id: { type: string, example: ABS-000001 }
        type: { type: string, enum: [absence, access] }
        resource: { type: string, example: gitlab }
        user_id: { type: string }
        date_from: { type: string }
        date_to: { type: string }
        reason: { type: string }
        team_id: { type: string }
        status: { type: string, enum: [draft, pending, approved, rejected, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        history:
          type: array
          description: Кто и когда перевёл заявку в статус
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              by: { type: string, description: id пользователя }
              status: { type: string }
              comment: { type: string }
