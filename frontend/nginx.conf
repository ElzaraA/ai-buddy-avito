server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SSE-поток чата: без буферизации, иначе события придут пачкой в конце
  location ~ ^/api/v1/chat/sessions/[^/]+/events$ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    # агент отвечает до 60 с (синхронный /api/ask)
    proxy_read_timeout 75s;
  }

  # MCP-эндпоинт и служебные адреса бэкенда — с того же origin
  location = /mcp { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location = /health { proxy_pass http://api:8080; }

  # хешированные ассеты кешируются, index.html — нет (после обновления сразу новая версия)
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
