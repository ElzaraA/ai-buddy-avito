server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SSE-поток чата: без буферизации, иначе события придут пачкой в конце
  location ~ ^/api/v1/chat/sessions/[^/]+/events$ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
