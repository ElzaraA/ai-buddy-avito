name: backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: utf-8 guard (no mojibake)
        run: "! grep -rlE 'Р[°µ¸ѕ]|РЎ' --include='*.go' --include='*.md' ."
      - name: test with race detector
        run: go test -race ./...
      - name: coverage >= 80%
        run: |
          go test ./... -coverprofile=coverage/coverage.out
          go tool cover -func=coverage/coverage.out | tail -1
          go tool cover -func=coverage/coverage.out | awk '/^total:/ {sub("%","",$3); if ($3+0 < 80) {print "coverage below 80%"; exit 1}}'
      - name: docker build
        run: docker build -t ai-buddy-backend .
